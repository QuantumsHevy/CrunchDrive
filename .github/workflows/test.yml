name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Only the test project is built: the plugin itself needs the KSP assemblies, which the runner does not have.
      - name: Run tests
        run: dotnet test tests/CrunchDrive.Core.Tests --configuration Release --verbosity normal